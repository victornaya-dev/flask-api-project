apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
      - name: flask-api
        image: victordock218/myapp_flask_v003:tagname
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: flask-api-config
